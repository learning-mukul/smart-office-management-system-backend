<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome Email</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px;">
<div style="max-width: 600px; margin: auto; background: #ffffff; padding: 20px; border-radius: 8px;">
    <h2 style="color: #2c3e50;">Welcome to Smart Office</h2>
    <p>Dear <span th:text="${name}">Employee</span>,</p>
    <p>We are excited to have you join our company. Your registered email is <span th:text="${email}">email@example.com</span>.</p>
    <p>We look forward to working with you!</p>
    <hr/>
    <p style="font-size: 12px; color: #888;">This is an automated message from Smart Office Management System.</p>
</div>
</body>
</html>
